# Projet généré par XcodeGen : `xcodegen generate` dans ios/.
name: Parcourses
options:
  bundleIdPrefix: app.parcourses
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Dépendances transitives figées : Package.resolved est versionné, le .xcodeproj ne l'est pas.
  postGenCommand: >-
    mkdir -p Parcourses.xcodeproj/project.xcworkspace/xcshareddata/swiftpm &&
    cp Package.resolved Parcourses.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Domain:
    path: Packages/Domain
  SortEngine:
    path: Packages/SortEngine
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6
targets:
  Parcourses:
    type: application
    platform: iOS
    sources: [Parcourses, Shared]
    dependencies:
      - package: Domain
      - package: SortEngine
      - package: Supabase
        product: Supabase
      - target: ParcoursesWidgets
    entitlements:
      path: Parcourses/Parcourses.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Parcourses/Info.plist
      properties:
        CFBundleDisplayName: Parcourses
        # App en français : les libellés système (clavier, VoiceOver) suivent.
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        AppGroupIdentifier: $(APP_GROUP_ID)
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.parcourses.sync]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: "Parcourses utilise votre position une seule fois pour trouver le magasin où vous êtes. Elle n'est ni conservée ni envoyée ailleurs que pour cette recherche."
        NSLocationTemporaryUsageDescriptionDictionary:
          StorePicker: "La position précise permet de proposer le magasin où vous êtes. Elle n'est pas conservée."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  ParcoursesWidgets:
    type: app-extension
    platform: iOS
    sources: [ParcoursesWidgets, Shared]
    entitlements:
      path: ParcoursesWidgets/ParcoursesWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: ParcoursesWidgets/Info.plist
      properties:
        CFBundleDisplayName: Parcourses
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
  ParcoursesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ParcoursesTests
      - path: ../shared/contract/tables.json
        buildPhase: resources
      - path: ../supabase/migrations
        type: folder
        buildPhase: resources
    dependencies:
      - target: Parcourses
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ParcoursesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ParcoursesUITests]
    dependencies:
      - target: Parcourses
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Parcourses:
    build:
      targets:
        Parcourses: all
    test:
      gather_coverage_data: true
      targets: [ParcoursesTests, ParcoursesUITests]
