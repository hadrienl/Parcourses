# CI de l'app iOS : paquets, lint, build et tests sur iOS 18 et sur le dernier iOS.
name: iOS

on:
  pull_request:
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

defaults:
  run:
    working-directory: ios

jobs:
  packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Xcode le plus récent
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Cache .build des paquets
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ios/Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Packages/*/Package.swift', 'ios/Packages/*/Package.resolved') }}
      - name: Dictionnaire embarqué identique à shared/categories
        run: scripts/sync-categories.sh --check
      - name: Tests des paquets
        run: |
          for p in Domain SortEngine; do (cd "Packages/$p" && swift test); done
      - name: Performance du tri (release)
        working-directory: ios/Packages/SortEngine
        run: swift test -c release --filter PerformanceTests

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: xcrun swift-format lint --strict -r .

  app:
    name: app (iOS ${{ matrix.ios }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        ios: ["18", "latest"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Runtimes disponibles
        run: xcrun simctl list runtimes
      - name: Runtime iOS 18 (téléchargé s'il manque)
        if: matrix.ios == '18'
        # ~4 min mesurées (8,9 Go) : trop gros pour actions/cache, on borne la durée.
        timeout-minutes: 15
        run: |
          xcrun simctl list runtimes | grep -q "iOS 18" || xcodebuild -downloadPlatform iOS -buildVersion 18.6
      - name: XcodeGen (version épinglée, vérifiée par SHA-256)
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Cache DerivedData
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ios/DerivedData
          key: dd-${{ matrix.ios }}-${{ hashFiles('ios/project.yml', 'ios/Config/*.xcconfig', 'ios/Packages/*/Package.swift') }}
      - name: Build et tests
        run: |
          udid=$(scripts/simulator.sh "${{ matrix.ios }}")
          xcrun simctl list devices | grep "$udid"
          xcodebuild test -project Parcourses.xcodeproj -scheme Parcourses \
            -destination "id=$udid" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: xcresult-ios-${{ matrix.ios }}
          path: ios/TestResults.xcresult
