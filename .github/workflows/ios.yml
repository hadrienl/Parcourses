# CI de l'app iOS : paquets, lint, build et tests sur iOS 18 et sur le dernier iOS.
name: iOS

on:
  pull_request:
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

jobs:
  packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Tests des paquets
        run: |
          for p in Domain SortEngine; do (cd "Packages/$p" && swift test); done

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: xcrun swift-format lint --strict -r .

  app:
    name: app (iOS ${{ matrix.ios }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        ios: ["18", "latest"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Runtimes disponibles
        run: xcrun simctl list runtimes
      - name: Runtime iOS 18 (téléchargé s'il manque)
        if: matrix.ios == '18'
        run: |
          xcrun simctl list runtimes | grep -q "iOS 18" || xcodebuild -downloadPlatform iOS -buildVersion 18.6
      - name: XcodeGen
        run: (command -v xcodegen || brew install xcodegen) && xcodegen generate
      - name: Build et tests
        run: |
          udid=$(scripts/simulator.sh "${{ matrix.ios }}")
          xcrun simctl list devices | grep "$udid"
          xcodebuild test -project Parcourses.xcodeproj -scheme Parcourses \
            -destination "id=$udid" -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-ios-${{ matrix.ios }}
          path: ios/TestResults.xcresult
