# Socle partagé : tests de la référence et vérification des vecteurs commités.
name: shared

on:
  pull_request:
    paths:
      - "shared/**"
      - ".github/workflows/shared.yml"
  push:
    branches: [main]
    paths:
      - "shared/**"
      - ".github/workflows/shared.yml"

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.7
      # deno.json impose "lock": { "frozen": true } : une dépendance absente de deno.lock échoue.
      - name: Format et lint
        run: deno fmt --check && deno lint
      - name: Tests de la référence
        run: deno task test
      - name: Vecteurs régénérés identiques aux vecteurs commités
        run: deno task check
