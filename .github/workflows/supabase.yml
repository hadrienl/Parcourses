# CI du socle Supabase (issue #8) : migrations, idempotence, lint, tests pgTAP, contrat des types.
name: supabase

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - "shared/categories/**"
      - "shared/contract/**"
      - "shared/reference/**"
      - ".sqlfluff"
      - ".sqlfluffignore"
      - ".github/workflows/supabase.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/**"
      - "shared/categories/**"
      - "shared/contract/**"
      - "shared/reference/**"
      - ".github/workflows/supabase.yml"

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Version épinglée : la sortie de gen types dépend de la CLI.
          version: 2.121.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lint SQL statique
        run: |
          pip install --quiet sqlfluff==3.4.2
          sqlfluff lint supabase/

      - name: Migration des catégories conforme à shared/categories
        run: deno run --allow-read scripts/check-categories.ts

      - name: Démarrage
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,supavisor

      - name: Migrations et seeds depuis zéro
        run: supabase db reset

      - name: Idempotence des migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            docker exec -i supabase_db_parcourses psql -U postgres -v ON_ERROR_STOP=1 -q < "$f"
            echo "::endgroup::"
          done

      - name: Lint de la base
        run: supabase db lint -s public,graph --level warning --fail-on warning

      - name: Advisors
        run: supabase db advisors --local --level warn --fail-on warn

      - name: Tests pgTAP
        run: supabase test db

      - name: Bout en bout (visites → instantané → tri de référence)
        run: deno test --allow-run --allow-read --allow-env supabase/tests/e2e/

      - name: Types et contrat à jour
        run: |
          supabase gen types typescript --local > supabase/types/database.ts
          git diff --exit-code supabase/types/database.ts
          deno run --allow-read scripts/check-contract.ts

      - name: Arrêt
        if: always()
        run: supabase stop --no-backup
