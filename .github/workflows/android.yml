# CI Android de Parcourses (issue #10, §12).
name: Android

on:
  pull_request:
    paths: ["android/**", "shared/**", "design/icons/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "shared/**", "design/icons/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Dictionnaire embarqué identique à shared/categories
        run: scripts/sync-categories.sh --check
      - name: Icônes de rayon identiques à design/icons/categories
        run: python3 scripts/sync-category-icons.py --check
      - name: Style (ktlint + detekt)
        run: ./gradlew spotlessCheck detekt
      - name: Lint Android
        run: ./gradlew lintDebug
      # Les captures Roborazzi (app/src/test/screenshots) sont comparées dans la même passe.
      - name: Tests unitaires et captures
        run: ./gradlew testDebugUnitTest -Proborazzi.test.verify=true
      # :baselineprofile n'a que des variantes de mesure : on le compile sans le lancer (pas d'émulateur en CI).
      - name: Build debug et release
        run: ./gradlew assembleDebug assembleRelease :baselineprofile:compileBenchmarkReleaseKotlin
      - name: Noms gardés par R8
        run: scripts/check-r8-mapping.sh
      - name: Annotations JUnit
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: android/**/build/test-results/**/TEST-*.xml
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: android/**/build/reports/
          if-no-files-found: ignore
      - name: APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: android/app/build/outputs/apk/**/*.apk
