# CI Android de Parcourses (issue #10, §12).
name: Android

on:
  pull_request:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Style (ktlint + detekt)
        run: ./gradlew spotlessCheck detekt
      - name: Lint Android
        run: ./gradlew lintDebug
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest
      - name: Build debug et release
        run: ./gradlew assembleDebug assembleRelease
      - name: Annotations JUnit
        if: always()
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        with:
          report_paths: android/**/build/test-results/**/TEST-*.xml
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: android/**/build/reports/
          if-no-files-found: ignore
      - name: APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: android/app/build/outputs/apk/**/*.apk
