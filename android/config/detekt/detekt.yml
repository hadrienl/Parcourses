# Surcharges de la configuration detekt par défaut.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
style:
  UnusedParameter:
    active: true
  MaxLineLength:
    excludes: ['**/test/**']
complexity:
  LongMethod:
    # Les tests de scénario (une histoire par test) dépassent 60 lignes sans que cela nuise à leur lecture.
    excludes: ['**/test/**']
