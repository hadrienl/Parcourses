# Surcharges de la configuration detekt par défaut.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
exceptions:
  TooGenericExceptionCaught:
    active: false
style:
  ReturnCount:
    max: 5
    excludeGuardClauses: true
  UnusedParameter:
    active: true
  MaxLineLength:
    excludes: ['**/test/**']
